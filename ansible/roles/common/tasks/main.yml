---
- name: Update all packages
  ansible.builtin.yum:
    name: "*"
    state: latest

- name: Install base packages
  ansible.builtin.yum:
    name:
      - python3
      - python3-pip
      - unzip
      - curl
      - git
      - docker
    state: present

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Install Docker python module (required for Ansible docker_container)
  ansible.builtin.pip:
    name: docker
    executable: pip3

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
