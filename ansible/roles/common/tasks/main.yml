---
# - name: Clean DNF cache
#   ansible.builtin.command: dnf clean all
#   become: true
#   args:
#     warn: false

- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
    allowerasing: yes
  become: true            

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - python3-requests  # Add this to ensure requests is managed by dnf
      - unzip
      - curl
      - git
      - docker
    state: present
    allowerasing: yes
  become: true

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true

# --- CHANGE THIS TASK ---
- name: Install Docker python module via DNF
  ansible.builtin.dnf:
    name: python3-docker  # This replaces the 'pip install docker' task
    state: present
  become: true

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
  become: true