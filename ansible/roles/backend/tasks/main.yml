---
- name: Install Python dependencies
  ansible.builtin.yum:
    name:
      - python3
      - python3-pip
      - postgresql-libs
    state: present

- name: Install app Python packages
  ansible.builtin.pip:
    name:
      - fastapi
      - uvicorn
      - sqlalchemy
      - psycopg2-binary
      - pydantic
    executable: pip3

- name: Create backend directory
  ansible.builtin.file:
    path: /opt/backend
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Create /etc/backend for Vault-rendered credentials
  ansible.builtin.file:
    path: /etc/backend
    state: directory
    owner: root
    group: ec2-user
    mode: '0750'

- name: Deploy FastAPI backend files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/backend/"
    dest: /opt/backend/
    mode: '0644'

- name: Deploy systemd service for backend
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    mode: '0644'
  notify: Restart app

- name: Enable and start backend app
  ansible.builtin.systemd:
    name: app
    enabled: true
    state: started
    daemon_reload: true

handlers:
  - name: Restart app
    ansible.builtin.systemd:
      name: app
      state: restarted
      daemon_reload: true
