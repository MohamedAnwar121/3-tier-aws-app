---
- name: Create /etc/backend for Vault-rendered credentials
  ansible.builtin.file:
    path: /etc/backend
    state: directory
    owner: root
    group: ec2-user
    mode: '0750'

- name: Run backend Docker container
  community.docker.docker_container:
    name: backend
    image: "{{ backend_image | default('your-dockerhub-username/backend:latest') }}"
    pull: true
    state: started
    restart_policy: always
    ports:
      - "8000:8000"
    # We pass the file that Vault Agent generated
    env_file: /etc/backend/db.env
